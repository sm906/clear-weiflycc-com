<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>系統設定</title>

<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:"Microsoft JhengHei"}
body{background:#0f172a;padding:20px;color:#fff}
.card{
background:#fff;
color:#111827;
padding:18px;
border-radius:18px;
margin-bottom:12px;
}
</style>
</head>

<body>

<h1>系統規則</h1>

<div id="rules">
載入中...
</div>

<script>

const API =
"https://clear-weiflycc-com.smstar.workers.dev/api";

async function loadRules(){

const res =
await fetch(
API+"/settings/rules"
);

const rows =
await res.json();

let html="";

rows.forEach(x=>{

html += `
<div class="card">
<b>${x.rule_key}</b>
<br>
${x.rule_value}
</div>
`;

});

document.getElementById(
"rules"
).innerHTML = html;

}

loadRules();

</script>

</body>
</html>
