<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>證明文件上傳</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:"Microsoft JhengHei";background:#0f172a;color:#fff;padding:18px}
.watermark{position:fixed;right:-10px;bottom:10px;font-size:100px;font-weight:900;color:#dc2626;opacity:.04;transform:rotate(-20deg)}
.nav{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin-bottom:18px}
.nav a{text-decoration:none;background:#1e293b;padding:10px;border-radius:10px;color:#fff;text-align:center;font-size:12px}
.card{background:#fff;color:#111;padding:18px;border-radius:18px}
input{width:100%;padding:14px;border-radius:12px;border:1px solid #ddd;margin-top:12px}
button{width:100%;padding:15px;background:#f59e0b;border:none;border-radius:12px;font-weight:bold;margin-top:14px}
</style>
</head>
<body>

<div class="watermark">毅澄環保</div>

<div class="nav">
<a href="/">首頁</a>
<a href="/wall/">回音牆</a>
<a href="/leave/">請假</a>
<a href="/schedule/">排休</a>
<a href="/upload/">上傳</a>
</div>

<div class="card">

<h2>證明文件上傳</h2>

<form id="uploadForm">

<input name="name" placeholder="姓名" required>

<input type="file" name="file" required>

<button type="submit">
上傳文件
</button>

</form>

</div>

<script>
document.getElementById("uploadForm")
.addEventListener("submit",async(e)=>{

e.preventDefault();

const fd=new FormData(e.target);

const res=await fetch("/api/upload/clear",{
method:"POST",
body:fd
});

const data=await res.json();

alert(data.success?"上傳成功":"上傳失敗");

if(data.success)e.target.reset();

});
</script>

</body>
</html>
