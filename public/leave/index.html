<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>線上請假</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:"Microsoft JhengHei";background:#0f172a;color:#fff;padding:18px}
.watermark{position:fixed;right:-10px;bottom:10px;font-size:100px;font-weight:900;color:#dc2626;opacity:.04;transform:rotate(-20deg)}
.nav{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin-bottom:18px}
.nav a{text-decoration:none;background:#1e293b;padding:10px;border-radius:10px;color:#fff;text-align:center;font-size:12px}
.card{background:#fff;color:#111;padding:18px;border-radius:18px}
input,select,textarea{width:100%;padding:14px;border-radius:12px;border:1px solid #ddd;margin-top:12px}
button{width:100%;padding:15px;background:#f59e0b;border:none;border-radius:12px;font-weight:bold;margin-top:14px}
</style>
</head>
<body>

<div class="watermark">毅澄環保</div>

<div class="nav">
<a href="/">首頁</a>
<a href="/wall/">回音牆</a>
<a href="/leave/">請假</a>
<a href="/schedule/">排休</a>
<a href="/upload/">上傳</a>
</div>

<div class="card">

<h2>線上請假</h2>

<form id="leaveForm">

<input name="name" placeholder="姓名" required>

<select name="leave_type">
<option>事假</option>
<option>病假</option>
<option>特休</option>
<option>公假</option>
</select>

<input type="date" name="start_date" required>

<input type="date" name="end_date" required>

<textarea name="reason" rows="5" placeholder="請假原因"></textarea>

<button type="submit">
送出請假申請
</button>

</form>

</div>

<script>
document.getElementById("leaveForm")
.addEventListener("submit",async(e)=>{
e.preventDefault();

const fd=new FormData(e.target);

const res=await fetch("/api/leave/clear",{
method:"POST",
headers:{"Content-Type":"application/json"},
body:JSON.stringify({
name:fd.get("name"),
leave_type:fd.get("leave_type"),
start_date:fd.get("start_date"),
end_date:fd.get("end_date"),
reason:fd.get("reason")
})
});

const data=await res.json();

alert(data.success?"送出成功":"送出失敗");

if(data.success)e.target.reset();
});
</script>

</body>
</html>
