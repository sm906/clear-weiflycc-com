<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>員工回音牆 | 毅澄環保</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{
font-family:"Microsoft JhengHei",sans-serif;
background:#0f172a;
color:#fff;
padding:18px;
}

.watermark{
position:fixed;
right:0;
bottom:20px;
font-size:90px;
font-weight:900;
color:#dc2626;
opacity:.04;
transform:rotate(-20deg);
pointer-events:none;
}

.logo{
width:120px;
display:block;
margin:10px auto 20px;
}

h1{
text-align:center;
margin-bottom:10px;
}

.subtitle{
text-align:center;
color:#cbd5e1;
margin-bottom:30px;
}

.nav{
display:grid;
grid-template-columns:1fr 1fr;
gap:10px;
margin-bottom:25px;
}

.nav a{
text-decoration:none;
background:#1e293b;
padding:14px;
border-radius:14px;
text-align:center;
color:#fff;
}

.card{
background:#fff;
color:#111827;
padding:18px;
border-radius:18px;
margin-bottom:15px;
}

input,
textarea{
width:100%;
padding:14px;
border:1px solid #ddd;
border-radius:12px;
margin-top:10px;
}

button{
width:100%;
padding:15px;
background:#f59e0b;
color:#111827;
border:none;
border-radius:12px;
font-weight:bold;
margin-top:15px;
}

.feed{
margin-top:25px;
}

.item{
background:#1e293b;
padding:16px;
border-radius:14px;
margin-bottom:12px;
}

.name{
font-weight:bold;
margin-bottom:8px;
color:#f59e0b;
}

.footer{
text-align:center;
margin-top:30px;
color:#cbd5e1;
font-size:13px;
}

</style>
</head>

<body>

<div class="watermark">
毅澄環保
</div>

<img
src="/image/logo.jpg"
class="logo">

<h1>員工回音牆</h1>

<div class="subtitle">
意見反映與工作建議
</div>

<div class="nav">
<a href="/">首頁</a>
<a href="/leave/">請假</a>
<a href="/schedule/">排休</a>
<a href="/upload/">上傳</a>
</div>

<div class="card">

<form id="feedbackForm">

<input
name="name"
placeholder="姓名"
required>

<textarea
name="message"
rows="5"
placeholder="請輸入建議或意見"
required></textarea>

<button type="submit">
送出意見
</button>

</form>

</div>

<div
class="feed"
id="feedbackList">

</div>

<div class="footer">

yicheng@weiflycc.com

</div>

<script>

async function loadFeedback(){

try{

const res =
await fetch(
"/api/feedback/clear/list"
);

const data =
await res.json();

const list =
document.getElementById(
"feedbackList"
);

list.innerHTML="";

data.forEach(item=>{

const div =
document.createElement("div");

div.className="item";

div.innerHTML=`
<div class="name">
${item.name}
</div>

<div>
${item.message}
</div>
`;

list.appendChild(div);

});

}catch(e){}

}

document
.getElementById("feedbackForm")
.addEventListener("submit",
async (e)=>{

e.preventDefault();

const fd =
new FormData(
e.target
);

const res =
await fetch(
"/api/feedback/clear",
{
method:"POST",
headers:{
"Content-Type":
"application/json"
},
body:JSON.stringify({
name:
fd.get("name"),
message:
fd.get("message")
})
}
);

const data =
await res.json();

if(data.success){

alert("送出成功");

e.target.reset();

loadFeedback();

}else{

alert("送出失敗");

}

});

loadFeedback();

</script>

</body>
</html>
