<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>員工回音牆</title>
</head>
<body>

<h1>員工回音牆</h1>

<form id="feedback">

<input
name="name"
placeholder="姓名"
required>

<br><br>

<textarea
name="message"
placeholder="請輸入意見"
required
style="width:100%;height:180px"></textarea>

<br><br>

<button type="submit">
送出
</button>

</form>

<script>
document
.getElementById("feedback")
.addEventListener("submit",async(e)=>{

e.preventDefault();

const fd=new FormData(e.target);

await fetch("/api/feedback/clear",{
method:"POST",
headers:{
"Content-Type":"application/json"
},
body:JSON.stringify({
name:fd.get("name"),
message:fd.get("message"),
email:"yicheng@weiflycc.com"
})
});

alert("已送出");

e.target.reset();

});
</script>

</body>
</html>
