<!doctype html>
<html lang="zh-Hant">
<head>

<meta charset="utf-8">

<meta
name="viewport"
content="width=device-width,initial-scale=1"
>

<title>
毅澄環保｜員工回音牆
</title>

<style>

:root{

--primary:#57C7AE;
--primary-dark:#3DA58D;
--primary-light:#71D7BE;

--blue:#1996D3;

--text:#333333;
--bg:#F5F7F6;

}

*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{
background:var(--bg);
color:var(--text);
font-family:
"Microsoft JhengHei",
sans-serif;
}

.hero{

background:
linear-gradient(
135deg,
var(--primary),
var(--blue)
);

color:#fff;

padding:
80px 20px;

text-align:center;
}

.hero h1{
font-size:48px;
margin-bottom:15px;
}

.hero p{
opacity:.95;
}

.container{
max-width:1000px;
margin:auto;
padding:40px 20px;
}

.card{

background:#fff;

border-radius:20px;

padding:30px;

box-shadow:
0 10px 30px rgba(
0,
0,
0,
0.08
);

}

label{
display:block;
margin-top:20px;
margin-bottom:10px;
font-weight:700;
}

input,
textarea{

width:100%;

padding:14px;

border:

1px solid #d9e3df;

border-radius:12px;

font-size:16px;
}

textarea{
height:180px;
resize:none;
}

button{

background:
var(--primary);

color:#fff;

border:0;

padding:
14px 28px;

border-radius:
12px;

font-size:16px;

cursor:pointer;

margin-top:20px;
}

button:hover{

background:
var(--primary-dark);

}

.info{

margin-top:30px;

background:
#e8faf5;

border-left:
5px solid
var(--primary);

padding:20px;

border-radius:12px;
}

.success{

display:none;

margin-top:20px;

padding:15px;

background:
#dcfce7;

color:
#166534;

border-radius:
12px;
}

</style>

</head>

<body>

<section class="hero">

<h1>
員工回音牆
</h1>

<p>
毅澄環保內部建議與意見交流平台
</p>

</section>

<div class="container">

<div class="card">

<form id="feedbackForm">

<label>
姓名
</label>

<input
name="name"
required
>

<label>
意見內容
</label>

<textarea
name="message"
required
placeholder="請輸入建議、需求或改善方向..."
></textarea>

<button type="submit">
送出意見
</button>

<div
class="success"
id="success"
>
送出成功
</div>

</form>

<div class="info">

通知信箱

<br><br>

yicheng@weiflycc.com

</div>

</div>

</div>

<script>

document
.getElementById(
"feedbackForm"
)
.addEventListener(
"submit",
async(e)=>{

e.preventDefault();

const form =
new FormData(
e.target
);

const payload = {

name:
form.get("name"),

message:
form.get("message")

};

const res =
await fetch(
"/api/feedback/clear",
{
method:"POST",
headers:{
"Content-Type":
"application/json"
},
body:
JSON.stringify(
payload
)
}
);

if(res.ok){

document
.getElementById(
"success"
)
.style.display=
"block";

e.target.reset();

}

});

</script>

</body>
</html>
