<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>排班管理</title>

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:"Microsoft JhengHei";
}

body{
background:#0f172a;
padding:20px;
color:white;
}

.card{
background:white;
color:#111827;
padding:20px;
border-radius:18px;
margin-bottom:16px;
}

input,
button{
width:100%;
padding:12px;
margin-top:10px;
}

button{
background:#2563eb;
color:white;
border:0;
border-radius:10px;
}

.row{
padding:12px;
border-bottom:1px solid #eee;
}
</style>
</head>

<body>

<h1>
排班管理
</h1>

<div class="card">

<input
id="year"
value="2026">

<input
id="month"
value="11">

<button
onclick="runScheduler()">
執行 AutoScheduler
</button>

</div>

<div
class="card"
id="result">
等待執行...
</div>

<div
class="card"
id="warnings">
警示載入中...
</div>

<script>

const API =
"https://clear-weiflycc-com.smstar.workers.dev/api";

async function runScheduler(){

const year =
parseInt(
document.getElementById(
"year"
).value
);

const month =
parseInt(
document.getElementById(
"month"
).value
);

const res =
await fetch(
API+"/schedules/autoscheduler",
{
method:"POST",
headers:{
"Content-Type":
"application/json"
},
body:JSON.stringify({
year,
month
})
}
);

const data =
await res.json();

document.getElementById(
"result"
).innerHTML =
`
建立完成<br>
員工:${data.employees}<br>
區域:${data.areas}
`;

loadWarnings();

}

async function loadWarnings(){

const res =
await fetch(
API+"/schedules/warnings"
);

const rows =
await res.json();

let html="";

rows.forEach(x=>{

html += `
<div class="row">

${x.work_date}

<br>

${x.warning_type}

<br>

${x.message}

</div>
`;

});

document.getElementById(
"warnings"
).innerHTML =
html || "無警示";

}

loadWarnings();

</script>

</body>
</html>
