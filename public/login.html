<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>毅澄環保管理中心登入</title>

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:"Microsoft JhengHei";
}

body{
background:#0f172a;
display:flex;
justify-content:center;
align-items:center;
height:100vh;
}

.card{
background:white;
width:380px;
padding:24px;
border-radius:20px;
}

h1{
margin-bottom:15px;
}

input{
width:100%;
padding:12px;
margin-top:10px;
border:1px solid #ddd;
border-radius:10px;
}

button{
width:100%;
padding:12px;
margin-top:15px;
border:0;
border-radius:10px;
background:#2563eb;
color:white;
}

.error{
color:red;
margin-top:10px;
}
</style>
</head>

<body>

<div class="card">

<h1>管理中心登入</h1>

<input
id="username"
placeholder="帳號">

<input
id="password"
type="password"
placeholder="密碼">

<button
onclick="login()">
登入
</button>

<div
class="error"
id="error">
</div>

</div>

<script>

const API =
"https://clear-weiflycc-com.smstar.workers.dev/api";

async function login(){

const res =
await fetch(
API + "/auth/login",
{
method:"POST",
headers:{
"Content-Type":
"application/json"
},
body:JSON.stringify({
username:
document.getElementById(
"username"
).value,
password:
document.getElementById(
"password"
).value
})
}
);

const data =
await res.json();

if(!data.success){

document.getElementById(
"error"
).textContent =
"帳號或密碼錯誤";

return;

}

localStorage.setItem(
"token",
data.token
);

localStorage.setItem(
"user",
JSON.stringify(data.user)
);

location.href =
"/dashboard.html";

}

</script>

</body>
</html>
